[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creditlens"
version = "0.1.0"
description = "Automated credit-research agent: SEC EDGAR + local RAG + Claude tool-use"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "google-genai>=0.3.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "python-dotenv>=1.0",
]

[project.scripts]
creditlens = "creditlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
